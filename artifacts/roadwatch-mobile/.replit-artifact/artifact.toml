kind = "mobile"
previewPath = "/roadwatch-mobile/"
title = "Roadwatch"
description = "A native iOS analyst dashboard for reviewing road-surface defects detected by car-mounted vision, LiDAR, IMU, and thermal sensors. Includes severity prioritization, a geographic heat map, and a sensor-fusion event feed."
version = "1.0.0"
id = "artifacts/roadwatch-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/roadwatch-mobile/" ]
localPort = 21906

[services.development]
run = "pnpm --filter @workspace/roadwatch-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/roadwatch-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/roadwatch-mobile", "run", "serve" ]

[services.env]
PORT = "21906"
BASE_PATH = "/roadwatch-mobile/"
