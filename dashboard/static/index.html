<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>InfraPulse — pavement screening</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { font-family: "Segoe UI", system-ui, sans-serif; color: #e8eef7; background: #0b1220; }
    body { margin: 0; }
    header { padding: 16px 22px; border-bottom: 1px solid #1e2a44; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 18px; margin: 0; letter-spacing: 0.04em; }
    .muted { color: #8ba0bf; font-size: 13px; }
    main { display: grid; grid-template-columns: 1.4fr 1fr; min-height: calc(100vh - 62px); }
    #map { min-height: 480px; }
    #panel { padding: 16px; overflow: auto; border-left: 1px solid #1e2a44; }
    .kpi { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .card { background: #121b2e; border: 1px solid #243353; border-radius: 10px; padding: 10px 12px; min-width: 110px; }
    .card b { display: block; font-size: 20px; }
    .row { background: #121b2e; border: 1px solid #243353; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
    .scan { background: #121b2e; border: 1px solid #243353; border-radius: 10px; padding: 12px; margin: 12px 0; }
    .scan label { display: block; font-size: 12px; color: #8ba0bf; margin-top: 8px; }
    .scan input { width: 100%; box-sizing: border-box; background: #0b1220; color: #e8eef7; border: 1px solid #243353; border-radius: 6px; padding: 6px 8px; }
    .cost-grid { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
    iframe.calc { width: 100%; height: 560px; border: none; border-radius: 8px; background: #fff; }
    .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px; text-transform: uppercase; }
    .high, .emergency { background: #5b1d2a; color: #ffb4c1; }
    .medium { background: #4a3b12; color: #ffd978; }
    .low, .monitor { background: #163326; color: #9be7b7; }
    .delayed { background: #2a2150; color: #cbb6ff; }
    button { background: #2f6fed; color: white; border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
    button.primary { width: 100%; margin-top: 8px; padding: 12px; font-size: 16px; }
    button.ghost { background: transparent; border: 1px solid #243353; }
    .scan .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    details { margin-top: 16px; }
    summary { cursor: pointer; color: #8ba0bf; }
    @media (max-width: 800px) {
      header { flex-direction: column; align-items: flex-start; gap: 8px; }
      main { display: flex; flex-direction: column; }
      #panel { order: 1; border-left: 0; }
      #map { order: 2; min-height: 280px; }
      .scan input, .scan button { font-size: 16px; }
      iframe.calc { height: 70vh; }
    }
    header .actions { display: flex; gap: 8px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>INFRAPULSE</h1>
      <div class="muted">Scan a PLY, price the hole, drop the pin on the map.</div>
    </div>
  </header>
  <main>
    <div id="map"></div>
    <div id="panel">
      <h3>Scan</h3>
      <form class="scan" id="scan-form" onsubmit="return false">
        <label>Who scanned</label>
        <input id="who" value="ryan" />
        <label>Latitude</label>
        <input id="lat" value="34.0522" inputmode="decimal" />
        <label>Longitude</label>
        <input id="lon" value="-118.2437" inputmode="decimal" />
        <label>LiDAR file (.ply)</label>
        <input id="ply" type="file" accept="*/*" />
        <p class="muted" id="hint">Export a PLY from 3D Scanner or Polycam, then upload it. The pin uses the coordinates above.</p>
        <button type="button" class="primary" id="upload">Upload scan</button>
        <div class="actions">
          <button type="button" id="gps">Use this phone's GPS</button>
          <button type="button" class="ghost" id="scan">Try a sample hole</button>
        </div>
        <div id="scan-result"></div>
        <div id="calc-wrap" hidden>
          <iframe class="calc" src="https://asphapro.com/embed/pothole-repair-cost-calculator.html" title="Pothole Repair Cost Calculator – How Much Does It Cost to Fix a Pothole?" loading="lazy"></iframe>
          <p style="font-size:13px;text-align:center;margin-top:8px">Powered by <a href="https://asphapro.com/pothole-repair-cost-calculator.html" rel="dofollow">Pothole Repair Cost Calculator – How Much Does It Cost to Fix a Pothole?</a> — <a href="https://asphapro.com" rel="dofollow">Asphapro.com</a></p>
        </div>
      </form>
      <details>
        <summary>Practice queue</summary>
        <div class="kpi" id="kpis"></div>
        <div id="list"></div>
        <h3>Crew coverage</h3>
        <div id="cov" class="muted"></div>
        <p><button type="button" class="ghost" id="refresh">Re-run practice queue</button></p>
      </details>
    </div>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = window.L ? L.map("map").setView([34.055, -118.246], 14) : null;
    if (map) {
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);
    }
    let layer = map ? L.layerGroup().addTo(map) : null;
    let cityLayer = map ? L.layerGroup().addTo(map) : null;
    const colors = { emergency: "#ff4d6d", high: "#ff7a59", medium: "#ffd166", low: "#70e000", monitor: "#4cc9f0" };

    function render(data) {
      if (layer) layer.clearLayers();
      if (!data || !data.summary) {
        document.getElementById("kpis").innerHTML = "<div class='card'>Could not load run</div>";
        return;
      }
      const s = data.summary;
      document.getElementById("kpis").innerHTML = `
        <div class="card"><span class="muted">Segments</span><b>${s.segments}</b></div>
        <div class="card"><span class="muted">Work orders</span><b>${s.work_orders}</b></div>
        <div class="card"><span class="muted">High+</span><b>${s.high_or_worse}</b></div>
        <div class="card"><span class="muted">Mean integrity</span><b>${s.mean_integrity ?? "—"}</b></div>
        <div class="card"><span class="muted">NDT / modal</span><b>${s.ndt_or_modal ?? 0}</b></div>`;
      document.getElementById("cov").textContent =
        `Assign ${data.coverage.crews} crews → jobs ${data.coverage.assigned_ids.join(", ") || "none"}`;
      const list = document.getElementById("list");
      list.innerHTML = "";
      const ranked = [...data.events].sort((a,b) => b.priority_score - a.priority_score);
      ranked.forEach(e => {
        const loc = e.location;
        if (map) {
          L.circleMarker([loc.lat, loc.lon], {
            radius: 9, color: colors[e.priority] || "#fff", fillOpacity: 0.85
          }).bindPopup(`<b>${e.segment_id}</b><br>priority ${e.priority} (${e.priority_score.toFixed(0)})<br>${e.recommended_action}`).addTo(layer);
        }
        const div = document.createElement("div");
        div.className = "row";
        div.innerHTML = `<span class="tag ${e.priority}">${e.priority}</span>
          <b> ${e.segment_id}</b> <span class="muted">I=${e.integrity_index?.toFixed(0)} ${e.claim || ""}</span>
          <div class="muted">${e.explanation}</div>`;
        list.appendChild(div);
      });
    }

    async function load(refresh=false) {
      try {
        const r = await fetch("/api/run" + (refresh ? "?refresh=true" : ""));
        if (!r.ok) throw new Error("run " + r.status);
        render(await r.json());
      } catch (err) {
        document.getElementById("kpis").innerHTML = "<div class='card'>Practice queue unavailable</div>";
        console.error(err);
      }
      loadCity();
    }
    function demoCloud() {
      const pts = [];
      for (let i = 0; i < 420; i++) {
        const x = (Math.random() - 0.5) * 2.4;
        const y = (Math.random() - 0.5) * 1.2;
        let z = (Math.random() - 0.5) * 0.004;
        if (Math.abs(x) < 0.4 && Math.abs(y) < 0.25) z -= 0.05;
        pts.push([+x.toFixed(4), +y.toFixed(4), +z.toFixed(4)]);
      }
      return pts;
    }

    function money(n) { return "$" + Number(n || 0).toFixed(0); }

    function showScan(body) {
      const c = body.cost || {};
      const factors = Object.entries(c.factors || {})
        .map(([k, v]) => (v.source === "unavailable" ? `${k} n/a` : `${k} ${Math.round((v.severity || 0) * 100)}%`))
        .join(" · ");
      document.getElementById("scan-result").innerHTML = `
        <div class="cost-grid">
          <div class="card"><span class="muted">LiDAR</span><b>${c.length_ft}×${c.width_ft} ft</b><span class="muted">${c.depth_in} in deep</span></div>
          <div class="card"><span class="muted">Base (calculator)</span><b>${money(c.base_usd)}</b></div>
          <div class="card"><span class="muted">With LA factors</span><b>${money(c.adjusted_usd)}</b><span class="muted">+${Math.round((c.uplift || 0) * 100)}%</span></div>
          <div class="card"><span class="muted">Points</span><b>${body.lidar?.point_count ?? "—"}</b><span class="muted">${body.map?.contributors || 1} scanner(s)</span></div>
        </div>
        <div class="muted">${factors || "No live factors"}</div>
        <div class="muted">${c.note || ""}</div>`;
      document.getElementById("calc-wrap").hidden = false;
      const lat = Number(document.getElementById("lat").value);
      const lon = Number(document.getElementById("lon").value);
      if (map && Number.isFinite(lat) && Number.isFinite(lon)) map.setView([lat, lon], 17);
      loadCity();
      document.getElementById("scan-result").scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function scanBody(extra) {
      return {
        contributor_id: document.getElementById("who").value || "walker",
        lat: Number(document.getElementById("lat").value),
        lon: Number(document.getElementById("lon").value),
        ...extra,
      };
    }

    document.getElementById("gps").onclick = () => {
      if (!navigator.geolocation) {
        document.getElementById("scan-result").textContent = "This browser has no GPS.";
        return;
      }
      navigator.geolocation.getCurrentPosition(pos => {
        document.getElementById("lat").value = pos.coords.latitude.toFixed(6);
        document.getElementById("lon").value = pos.coords.longitude.toFixed(6);
        document.getElementById("scan-result").textContent = "GPS saved for the next scan.";
      }, () => {
        document.getElementById("scan-result").textContent = "GPS permission denied. Type the pin instead.";
      }, { enableHighAccuracy: true, timeout: 8000 });
    };

    async function scanDemo() {
      const btn = document.getElementById("scan");
      btn.disabled = true;
      document.getElementById("scan-result").textContent = "Scanning…";
      try {
        const r = await fetch("/api/scene", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(scanBody({ xyz: demoCloud(), notes: "sample hole" })),
        });
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          throw new Error(err.detail || ("scan " + r.status));
        }
        showScan(await r.json());
      } catch (err) {
        document.getElementById("scan-result").textContent = "Scan failed";
        console.error(err);
      }
      btn.disabled = false;
    }

    async function uploadPly() {
      const file = document.getElementById("ply").files[0];
      if (!file) {
        document.getElementById("scan-result").textContent = "Choose a .ply from the phone first.";
        return;
      }
      const btn = document.getElementById("upload");
      btn.disabled = true;
      document.getElementById("scan-result").textContent = "Reading LiDAR…";
      try {
        const dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(reader.error);
          reader.readAsDataURL(file);
        });
        const encoded = String(dataUrl).split(",")[1] || "";
        const r = await fetch("/api/scene", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(scanBody({ ply_b64: encoded, notes: "iphone ply" })),
        });
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          throw new Error(err.detail || ("ply " + r.status));
        }
        showScan(await r.json());
      } catch (err) {
        document.getElementById("scan-result").textContent = err.message || "PLY upload failed";
        console.error(err);
      }
      btn.disabled = false;
    }

    async function loadCity() {
      if (!cityLayer) return;
      cityLayer.clearLayers();
      const data = await fetch("/api/city").then(r => r.json()).catch(() => ({defects: []}));
      const pts = [];
      (data.defects || []).forEach(d => {
        const cost = d.cost || {};
        pts.push([d.lat, d.lon]);
        L.circleMarker([d.lat, d.lon], { radius: 8, color: "#c4b5fd", fillOpacity: 0.9 })
          .bindPopup(`<b>${d.scene_id || "scan"}</b><br>${d.depth_mm} mm · ${d.contributor_id}<br>base ${money(cost.base_usd)} · adjusted ${money(cost.adjusted_usd)}`)
          .addTo(cityLayer);
      });
      if (pts.length === 1) map.setView(pts[0], 17);
      else if (pts.length > 1) map.fitBounds(pts, { padding: [24, 24] });
    }

    if (!window.isSecureContext) {
      document.getElementById("gps").hidden = true;
      document.getElementById("hint").textContent = "GPS needs the Replit HTTPS page. On this address, type the pin from Maps, then upload the PLY.";
    }
    document.getElementById("scan").onclick = scanDemo;
    document.getElementById("upload").onclick = uploadPly;
    document.getElementById("refresh").onclick = () => load(true);
    load();
  </script>
</body>
</html>
