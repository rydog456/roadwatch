openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: road-context
    description: Environmental context affecting road infrastructure
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /road-context:
    get:
      operationId: getRoadContext
      tags: [road-context]
      summary: Get nearby weather and earthquake context
      description: Fetches National Weather Service conditions and alerts and nearby USGS earthquakes for a device-reported location.
      parameters:
        - name: latitude
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: longitude
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: radiusMiles
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 250
            default: 50
      responses:
        "200":
          description: Environmental context and per-provider availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoadContextResponse"
        "400":
          description: Invalid location or search radius
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]
    ContextSourceState:
      type: string
      enum: [available, partial, unavailable]
    RoadContextLocation:
      type: object
      properties:
        latitude:
          type: number
        longitude:
          type: number
      required: [latitude, longitude]
    WeatherAlert:
      type: object
      properties:
        id:
          type: string
        event:
          type: string
        headline:
          type: string
        severity:
          type: string
        startsAt:
          type: ["string", "null"]
        endsAt:
          type: ["string", "null"]
        sourceUrl:
          type: string
      required: [id, event, headline, severity, startsAt, endsAt, sourceUrl]
    WeatherContext:
      type: object
      properties:
        provider:
          type: string
        status:
          $ref: "#/components/schemas/ContextSourceState"
        temperature:
          type: ["number", "null"]
        temperatureUnit:
          type: ["string", "null"]
        shortForecast:
          type: ["string", "null"]
        precipitationProbability:
          type: ["integer", "null"]
        windSpeed:
          type: ["string", "null"]
        observedAt:
          type: ["string", "null"]
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/WeatherAlert"
        error:
          type: ["string", "null"]
      required:
        - provider
        - status
        - temperature
        - temperatureUnit
        - shortForecast
        - precipitationProbability
        - windSpeed
        - observedAt
        - alerts
        - error
    EarthquakeEvent:
      type: object
      properties:
        id:
          type: string
        magnitude:
          type: number
        place:
          type: string
        occurredAt:
          type: string
        depthKm:
          type: number
        distanceMiles:
          type: number
        sourceUrl:
          type: string
      required: [id, magnitude, place, occurredAt, depthKm, distanceMiles, sourceUrl]
    EarthquakeContext:
      type: object
      properties:
        provider:
          type: string
        status:
          $ref: "#/components/schemas/ContextSourceState"
        radiusMiles:
          type: number
        events:
          type: array
          items:
            $ref: "#/components/schemas/EarthquakeEvent"
        error:
          type: ["string", "null"]
      required: [provider, status, radiusMiles, events, error]
    RoadContextResponse:
      type: object
      properties:
        generatedAt:
          type: string
        location:
          $ref: "#/components/schemas/RoadContextLocation"
        radiusMiles:
          type: number
        weather:
          $ref: "#/components/schemas/WeatherContext"
        earthquakes:
          $ref: "#/components/schemas/EarthquakeContext"
      required: [generatedAt, location, radiusMiles, weather, earthquakes]

